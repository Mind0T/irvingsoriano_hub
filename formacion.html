<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formación · Irvin Soriano</title>
<meta name="description" content="Formación y certificaciones de Irvin Soriano: de soldadura y sistemas a psicología, fotografía y ciencia de datos, con credenciales en nube y datos.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sistema.css">
<style>
.two{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start}
.cert-group{border:1px solid var(--border-default); background:var(--bg-surface); border-radius:var(--radius-lg); padding:22px; margin-bottom:16px}
.cert-group h3{font-size:15px; letter-spacing:.03em; margin-bottom:14px}
.cert{display:flex; align-items:flex-start; gap:11px; padding:10px 0; border-top:1px solid var(--border-default)}
.cert:first-of-type{border-top:0}
.cert .mk{flex:0 0 auto; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:2px}
.cert .mk.done{background:rgba(127,184,154,.16)} .cert .mk.prog{background:rgba(226,163,54,.16)}
.cert .mk svg{width:12px; height:12px; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
.cert .mk.done svg{stroke:var(--color-ok)} .cert .mk.prog svg{stroke:var(--color-warn)}
.cert .c-name{color:var(--text-primary); font-weight:600; font-size:14.5px}
.cert .c-meta{font:600 11.5px var(--font-display); color:var(--text-muted)}
.credly{margin-top:8px; display:inline-flex; align-items:center; gap:8px; font:700 13px var(--font-display); color:var(--text-secondary)}
.credly:hover{color:var(--text-primary)} .credly svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
@media (max-width:860px){ .two{grid-template-columns:1fr; gap:28px} }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="wrap page">
  <div class="pagehead reveal" style="--acc:var(--data)">
    <p class="eyebrow" data-i18n="eye">Formación</p>
    <h2 data-i18n="h">El camino hasta aquí</h2>
    <p class="lead" data-i18n="p">Soldadura, sistemas, psicología, fotografía y ciencia de datos. Cada etapa dejó una herramienta que hoy uso.</p>
  </div>
  <div class="two">
    <div class="reveal"><div class="road" id="road"></div></div>
    <div class="reveal">
      <div id="certs"></div>
      <a class="credly" href="https://www.credly.com/users/irving-soriano" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 100-8 4 4 0 000 8zM12 15v6l-3-2-3 2v-6"/></svg><span data-i18n="credly">Verifica mis insignias en Credly</span></a>
    </div>
  </div>
</main>

<script src="js/fondo.js"></script>
<script>
window.PAGINA = "formacion";
window.I18N = {
  es:{eye:"Formación",h:"El camino hasta aquí",p:"Soldadura, sistemas, psicología, fotografía y ciencia de datos. Cada etapa dejó una herramienta que hoy uso.",credly:"Verifica mis insignias en Credly",done:"Obtenida",prog:"En curso",cert_h:"Certificaciones"},
  en:{eye:"Education",h:"The path so far",p:"Welding, systems, psychology, photography and data science. Each stage left a tool I still use.",credly:"Verify my badges on Credly",done:"Earned",prog:"In progress",cert_h:"Certifications"}
};
var EDU=[
  {yr:"2007–2010",c:"var(--text-muted)",es:"Técnico en Sistemas Computacionales",en:"Computer Systems Technician",w:"Centro de Computación Profesional de México"},
  {yr:"2007–2010",c:"var(--text-muted)",es:"Técnico en Soldadura Industrial",en:"Industrial Welding Technician",w:"CECyT · IPN"},
  {yr:"2013–2018",c:"var(--foto)",es:"Licenciatura en Psicología",en:"B.A. in Psychology",w:"Facultad de Psicología · UNAM",esn:"Pasante",enn:"Coursework completed"},
  {yr:"2020–2022",c:"var(--ux)",es:"Carrera en Fotografía",en:"Photography Program",w:"Escuela Activa de Fotografía"},
  {yr:"2024–…",c:"var(--data)",es:"Licenciatura en Ciencia de Datos",en:"B.S. in Data Science",w:"ESCOM · IPN",esn:"En curso · 3.er semestre",enn:"In progress · 3rd semester"}
];
var CERTS=[
  {by:"Google",items:[{n:"Google Cloud Computing Foundations",s:"done"},{n:"Google Cloud · Artificial Intelligence",s:"done"},{n:"Associate Cloud Engineer",s:"prog"}]},
  {by:"AWS",items:[{n:"Cloud Practitioner",s:"done"},{n:"AI Practitioner",s:"prog"}]},
  {by:"Oracle · Alura",items:[{n:"Data Science Specialist",s:"done"},{n:"Oracle Cloud Infrastructure Foundations",s:"done"}]},
  {by:"DataCamp · FinOps · EBAC",items:[{n:"Data Literacy · DataCamp",s:"done"},{n:"AI Fundamentals · DataCamp",s:"done"},{n:"FinOps Practitioner + FOCUS",s:"prog"},{n:"UX/UI · EBAC",s:"prog"}]}
];
function escp(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
window.render = function(lang){
  document.getElementById("road").innerHTML = EDU.map(function(e){
    var note = lang==="es"?e.esn:e.enn;
    return '<div class="road-node" style="--c:'+e.c+'"><div class="yr">'+escp(e.yr)+'</div><h3>'+escp(lang==="es"?e.es:e.en)+'</h3><div class="where">'+escp(e.w)+'</div>'+(note?'<div class="note">'+escp(note)+'</div>':'')+'</div>';
  }).join("");
  var ck='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>', cl='<svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M12 21a9 9 0 110-18 9 9 0 010 18z"/></svg>';
  document.getElementById("certs").innerHTML = CERTS.map(function(g){
    return '<div class="cert-group"><h3>'+escp(g.by)+'</h3>'+g.items.map(function(it){
      return '<div class="cert"><span class="mk '+it.s+'">'+(it.s==="done"?ck:cl)+'</span><span><span class="c-name">'+escp(it.n)+'</span><br><span class="c-meta">'+window.T(it.s)+'</span></span></div>';
    }).join("")+'</div>';
  }).join("");
};
</script>
<script src="js/sitio.js"></script>
</body>
</html>
