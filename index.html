<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irvin Soriano · Ciencia de Datos, UX/UI & AI</title>
<meta name="description" content="Portafolio de Irvin Soriano: donde los datos se encuentran con el diseño. Ciencia de datos, UX/UI y herramientas que construyo y uso todos los días.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- HERO ---------- */
.hero{display:grid; gap:22px; padding:clamp(14px,2.5vw,28px) 0 10px; justify-items:center; text-align:center}
.hero-tag{margin:2px 0 0; max-width:34ch; font:300 clamp(17px,2.5vw,27px)/1.35 var(--font-display); color:var(--text-secondary); letter-spacing:-.01em}
.hero-tag b{font-weight:600; color:var(--text-primary)}
.hero .cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:2px; justify-content:center}

/* ---------- CARRUSEL Datos × Diseño ---------- */
.stage{position:relative; width:100%; text-align:left; border:1px solid var(--border-default); border-radius:var(--radius-xl);
  background:linear-gradient(150deg, rgba(20,20,20,.9), #0C0C0C 70%); overflow:hidden; box-shadow:0 18px 60px rgba(0,0,0,.5);
  animation:stageIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes stageIn{from{opacity:0; transform:scale(.955) translateY(22px)} to{opacity:1; transform:none}}
.stage .kick{position:absolute; top:18px; left:22px; z-index:3; font:700 11px var(--font-display);
  letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted)}
.stage .glow{position:absolute; inset:0; z-index:0; opacity:.5; pointer-events:none;
  background:radial-gradient(420px 260px at 78% 30%, var(--c,transparent), transparent 70%); transition:background .8s ease}
.slides{position:relative; min-height:clamp(360px,54vh,540px)}
.slide{position:absolute; inset:0; display:grid; grid-template-columns:1.1fr .9fr; align-items:center;
  gap:20px; padding:clamp(28px,4vw,46px); opacity:0; transform:translateY(14px) scale(.985);
  transition:opacity .7s ease, transform .7s ease; pointer-events:none}
.slide.on{opacity:1; transform:none; pointer-events:auto}
.slide .txt{z-index:2}
.slide .facet{display:inline-flex; align-items:center; gap:9px; font:800 12.5px var(--font-display);
  letter-spacing:.12em; text-transform:uppercase; color:var(--c); margin-bottom:14px}
.slide .facet i{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 14px var(--c)}
.slide h3{font-size:clamp(22px,3.4vw,34px); font-weight:900; color:#fff; letter-spacing:-.02em; margin:0 0 10px}
.slide p{font-size:clamp(14px,1.8vw,16.5px); color:var(--text-secondary); max-width:34ch; margin:0}
.slide .viz{position:relative; height:200px; display:flex; align-items:center; justify-content:center}
.slide .viz svg{width:100%; height:100%; overflow:visible}
.stage .dots{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:3; display:flex; gap:9px}
.stage .dots button{width:9px; height:9px; border-radius:50%; background:var(--border-strong); transition:var(--transition-base)}
.stage .dots button[aria-pressed="true"]{background:var(--silver); width:26px; border-radius:99px}
.stage .ctrl{position:absolute; top:14px; right:16px; z-index:3; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--text-secondary)}
.stage .ctrl svg{width:15px; height:15px; fill:currentColor}
.stage .ctrl:hover{color:var(--text-primary); border-color:var(--silver)}

/* motivos animados */
@keyframes grow{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.slide.on .viz [data-anim="bar"]{transform-origin:bottom; animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.slide.on .viz [data-anim="line"]{stroke-dasharray:340; stroke-dashoffset:340; animation:draw 1.3s .4s ease-out forwards}
.slide.on .viz [data-anim="node"]{animation:pulse 2.4s ease-in-out infinite}
.slide.on .viz [data-anim="float"]{animation:drift 4s ease-in-out infinite}

@media (max-width:720px){
  .slide{grid-template-columns:1fr; gap:6px; padding:56px 24px 40px}
  .slide .viz{height:150px; order:-1}
  .slides{min-height:360px}
}
@media (prefers-reduced-motion:reduce){
  .slide{transition:none}
  .slide.on .viz *{animation:none!important}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="wrap page">
  <!-- HERO -->
  <section class="hero reveal">
    <!-- carrusel (protagonista) -->
    <section class="stage" id="stage" aria-roledescription="carrusel" aria-label="Datos y diseño">
      <span class="kick" data-i18n="kick">Donde los datos se encuentran con el diseño</span>
      <span class="glow" id="glow" aria-hidden="true"></span>
      <button class="ctrl" id="toggle" aria-label="Pausar"><svg id="toggleIcon" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg></button>
      <div class="slides" id="slides"></div>
      <div class="dots" id="dots" role="tablist" aria-label="Elegir faceta"></div>
    </section>

    <p class="hero-tag" data-i18n="hero_tag">El enfoque <b>Data-Driven</b> y el <b>diseño UX</b> son la verdadera diferencia en cualquier proyecto.</p>

    <div class="cta">
      <a class="btn primary" href="proyectos.html"><span data-i18n="hero_c1">Ver proyectos</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </section>
</main>

<script src="js/fondo.js"></script>
<script>
window.PAGINA = "inicio";
window.I18N = {
  es:{hero_tag:"El enfoque <b>Data-Driven</b> y el <b>diseño UX</b> son la verdadera diferencia en cualquier proyecto.",
    kick:"Donde los datos se encuentran con el diseño",
    hero_c1:"Ver proyectos",hero_c2:"Herramientas que uso"},
  en:{hero_tag:"A <b>data-driven</b> approach and <b>UX design</b> are the real difference in any project.",
    kick:"Where data meets design",
    hero_c1:"See projects",hero_c2:"Tools I use"}
};

/* ---- motivos SVG (data × diseño) ---- */
var VIZ = {
  data:'<svg viewBox="0 0 220 180" fill="none">'+
    '<g stroke="var(--data)" stroke-width="2" opacity=".25"><line x1="20" y1="150" x2="210" y2="150"/></g>'+
    '<g fill="var(--data)">'+
      '<rect data-anim="bar" x="30"  y="92"  width="26" height="58" rx="4" style="animation-delay:.05s"/>'+
      '<rect data-anim="bar" x="72"  y="66"  width="26" height="84" rx="4" style="animation-delay:.15s"/>'+
      '<rect data-anim="bar" x="114" y="104" width="26" height="46" rx="4" style="animation-delay:.25s"/>'+
      '<rect data-anim="bar" x="156" y="44"  width="26" height="106" rx="4" style="animation-delay:.35s"/>'+
    '</g>'+
    '<path data-anim="line" d="M43 110 L85 80 L127 120 L169 60" stroke="var(--silver)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'+
    '<circle data-anim="node" cx="169" cy="60" r="6" fill="var(--silver)"/></svg>',
  ux:'<svg viewBox="0 0 220 180" fill="none">'+
    '<g data-anim="float">'+
    '<rect x="34" y="30" width="152" height="120" rx="12" stroke="var(--ux)" stroke-width="2" opacity=".5"/>'+
    '<rect data-anim="bar" x="50" y="46" width="120" height="16" rx="5" fill="var(--ux)" opacity=".9" style="animation-delay:.1s"/>'+
    '<rect data-anim="bar" x="50" y="72" width="64" height="40" rx="6" fill="var(--ux)" opacity=".35" style="animation-delay:.2s"/>'+
    '<rect data-anim="bar" x="122" y="72" width="48" height="40" rx="6" fill="var(--ux)" opacity=".35" style="animation-delay:.3s"/>'+
    '<rect data-anim="bar" x="50" y="122" width="80" height="14" rx="5" fill="var(--silver)" opacity=".8" style="animation-delay:.4s"/>'+
    '</g>'+
    '<circle data-anim="node" cx="150" cy="129" r="7" fill="var(--ux)"/></svg>',
  cloud:'<svg viewBox="0 0 220 180" fill="none">'+
    '<g stroke="var(--cloud)" stroke-width="2" opacity=".4">'+
      '<line data-anim="line" x1="40" y1="90" x2="110" y2="50"/><line data-anim="line" x1="40" y1="90" x2="110" y2="130"/>'+
      '<line data-anim="line" x1="110" y1="50" x2="180" y2="90"/><line data-anim="line" x1="110" y1="130" x2="180" y2="90"/>'+
      '<line data-anim="line" x1="110" y1="50" x2="110" y2="130"/></g>'+
    '<g data-anim="float">'+
      '<circle data-anim="node" cx="40" cy="90" r="10" fill="var(--cloud)"/>'+
      '<circle data-anim="node" cx="110" cy="50" r="12" fill="var(--silver)" style="animation-delay:.3s"/>'+
      '<circle data-anim="node" cx="110" cy="130" r="9" fill="var(--cloud)" style="animation-delay:.6s"/>'+
      '<circle data-anim="node" cx="180" cy="90" r="11" fill="var(--cloud)" style="animation-delay:.9s"/>'+
    '</g></svg>',
  ai:'<svg viewBox="0 0 220 180" fill="none">'+
    '<g stroke="var(--ai)" stroke-width="1.6" opacity=".35">'+
      '<line x1="45" y1="55" x2="110" y2="45"/><line x1="45" y1="55" x2="110" y2="90"/><line x1="45" y1="55" x2="110" y2="135"/>'+
      '<line x1="45" y1="125" x2="110" y2="45"/><line x1="45" y1="125" x2="110" y2="90"/><line x1="45" y1="125" x2="110" y2="135"/>'+
      '<line x1="110" y1="45" x2="180" y2="90"/><line x1="110" y1="90" x2="180" y2="90"/><line x1="110" y1="135" x2="180" y2="90"/></g>'+
    '<g fill="var(--ai)">'+
      '<circle data-anim="node" cx="45" cy="55" r="8"/><circle data-anim="node" cx="45" cy="125" r="8" style="animation-delay:.3s"/>'+
      '<circle data-anim="node" cx="110" cy="45" r="7" style="animation-delay:.5s"/><circle data-anim="node" cx="110" cy="90" r="7" style="animation-delay:.7s"/>'+
      '<circle data-anim="node" cx="110" cy="135" r="7" style="animation-delay:.9s"/>'+
      '<circle data-anim="node" cx="180" cy="90" r="10" fill="var(--silver)" style="animation-delay:1.1s"/></g></svg>'
};
var CAR = [
  {k:"data", c:"var(--data)",
    es:{f:"Ciencia de Datos", h:"De los datos a la decisión", p:"Limpio, modelo y explico datos — de un EDA a un pipeline de ML — para que la decisión sea clara."},
    en:{f:"Data Science", h:"From data to decision", p:"I clean, model and explain data — from an EDA to an ML pipeline — so the decision is clear."}},
  {k:"ux", c:"var(--ux)",
    es:{f:"UX / UI", h:"Diseño que se entiende solo", p:"Interfaces claras, inclusivas y con intención. Menos fricción, menos fatiga de decisión."},
    en:{f:"UX / UI", h:"Design that explains itself", p:"Clear, inclusive, intentional interfaces. Less friction, less decision fatigue."}},
  {k:"cloud", c:"var(--cloud)",
    es:{f:"Nube & Datos", h:"De la idea al producto", p:"Llevo ideas de la nube al producto: AWS y Google Cloud, datos conectados y en vivo."},
    en:{f:"Cloud & Data", h:"From idea to product", p:"I take ideas from the cloud to the product: AWS and Google Cloud, data connected and live."}},
  {k:"ai", c:"var(--ai)",
    es:{f:"AI Engineering · pronto", h:"Lo que viene", p:"El siguiente paso: construir con IA sobre todo lo anterior. En camino."},
    en:{f:"AI Engineering · soon", h:"What's next", p:"The next step: building with AI on top of all the above. On the way."}}
];

var idx=0, timer=null, paused=false;
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

window.render = function(lang){
  var slides=document.getElementById("slides"), dots=document.getElementById("dots"), glow=document.getElementById("glow");
  slides.innerHTML = CAR.map(function(s,i){
    var t=s[lang]||s.es;
    return '<article class="slide'+(i===0?' on':'')+'" style="--c:'+s.c+'" role="tabpanel" aria-hidden="'+(i!==0)+'">'+
      '<div class="txt"><span class="facet"><i></i>'+t.f+'</span>'+
      '<h3>'+t.h+'</h3><p>'+t.p+'</p></div>'+
      '<div class="viz" aria-hidden="true">'+VIZ[s.k]+'</div></article>';
  }).join("");
  dots.innerHTML = CAR.map(function(s,i){
    var t=s[lang]||s.es;
    return '<button role="tab" data-i="'+i+'" aria-pressed="'+(i===0)+'" aria-label="'+t.f+'"></button>';
  }).join("");
  glow.style.setProperty("--c", CAR[0].c);
  idx=0;
  if(!reduce) start();
};

function show(i){
  var slides=document.querySelectorAll("#slides .slide"), dots=document.querySelectorAll("#dots button");
  if(!slides.length) return;
  idx=(i+slides.length)%slides.length;
  slides.forEach(function(el,n){ el.classList.toggle("on", n===idx); el.setAttribute("aria-hidden", n!==idx); });
  dots.forEach(function(el,n){ el.setAttribute("aria-pressed", n===idx); });
  document.getElementById("glow").style.setProperty("--c", CAR[idx].c);
}
function start(){ stop(); if(reduce||paused) return; timer=setInterval(function(){ show(idx+1); }, 4600); }
function stop(){ if(timer){ clearInterval(timer); timer=null; } }

document.getElementById("dots").addEventListener("click", function(e){
  var b=e.target.closest("[data-i]"); if(!b) return; show(+b.dataset.i); start();
});
var stage=document.getElementById("stage");
stage.addEventListener("mouseenter", stop);
stage.addEventListener("mouseleave", function(){ if(!paused) start(); });
stage.addEventListener("focusin", stop);
stage.addEventListener("focusout", function(){ if(!paused) start(); });
document.getElementById("toggle").addEventListener("click", function(){
  paused=!paused;
  this.setAttribute("aria-label", paused?"Reproducir":"Pausar");
  document.getElementById("toggleIcon").innerHTML = paused
    ? '<path d="M8 5v14l11-7z"/>' : '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
  if(paused) stop(); else start();
});
</script>
<script src="js/sitio.js"></script>
</body>
</html>
