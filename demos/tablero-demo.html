<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Tablero · Demo</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface2:#1C1C1C; --lane:#0F0F0F;
    --border:#262626; --border2:#3A3A3A;
    --tx:#EDEDED; --tx2:#A3A3A3; --tx3:#6B6B6B;
    --acc:#9DB4CF; --ok:#7FB89A; --warn:#E2A336; --err:#E5484D; --info:#5B8DEF; --ux:#B79CC9;
    --font:"Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 700px at 80% -10%, color-mix(in oklab,var(--acc) 10%, transparent), transparent 60%),
      var(--bg);
    color:var(--tx); font-family:var(--body); padding:26px 30px 34px; min-height:100%;
    -webkit-font-smoothing:antialiased}
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px}
  h1{font-family:var(--font); font-weight:800; font-size:30px; letter-spacing:-.01em; display:flex; align-items:center; gap:14px}
  .dot{width:13px; height:13px; border-radius:50%; background:var(--acc); box-shadow:0 0 16px color-mix(in oklab,var(--acc) 70%, transparent)}
  .sub{color:var(--tx2); font-size:14px; margin-top:6px}
  .demo-badge{font-family:var(--font); font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--warn); border:1px solid color-mix(in oklab,var(--warn) 45%, var(--border)); background:color-mix(in oklab,var(--warn) 12%, transparent);
    padding:7px 12px; border-radius:999px; white-space:nowrap}
  .chips{display:flex; gap:12px; margin:0 0 22px; flex-wrap:wrap}
  .chip{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 16px; min-width:120px}
  .chip .n{font-family:var(--font); font-weight:800; font-size:24px; line-height:1}
  .chip .l{color:var(--tx2); font-size:12px; margin-top:5px; letter-spacing:.02em}
  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:start}
  .col{background:var(--lane); border:1px solid var(--border); border-radius:var(--r); padding:14px 13px; min-height:240px}
  .col h2{font-family:var(--font); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2);
    display:flex; align-items:center; gap:8px; margin-bottom:13px}
  .col h2 .ct{margin-left:auto; color:var(--tx3); background:var(--surface2); border-radius:999px; padding:2px 9px; font-size:11px; letter-spacing:0}
  .col h2 .bar{width:8px; height:8px; border-radius:2px; background:var(--acc)}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 13px; margin-bottom:11px;
    box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .card:last-child{margin-bottom:0}
  .card .t{font-size:14px; font-weight:600; line-height:1.3; margin-bottom:9px}
  .labels{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
  .lab{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px}
  .meta{display:flex; align-items:center; gap:10px; color:var(--tx3); font-size:12px}
  .meta .due{display:flex; align-items:center; gap:5px}
  .meta .ava{margin-left:auto; width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2);
    display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--tx2)}
  .prog{height:5px; border-radius:3px; background:var(--surface2); overflow:hidden; margin-top:10px}
  .prog > i{display:block; height:100%; background:var(--acc); border-radius:3px}
  .roads{margin-top:24px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px 20px}
  .roads h3{font-family:var(--font); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--tx2); margin-bottom:16px}
  .roads-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px}
  .road .rt{font-size:13px; font-weight:600; display:flex; justify-content:space-between; margin-bottom:8px}
  .road .rt span{color:var(--tx3)}
  .road .prog{margin-top:0; height:7px}
  .foot{margin-top:22px; color:var(--tx3); font-size:12px; text-align:center}
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1><span class="dot"></span><span id="title">Tablero de actividades</span></h1>
      <div class="sub" id="subtitle">Kanban · calendario · recordatorios — vista de ejemplo</div>
    </div>
    <div class="demo-badge">Demo · datos de ejemplo</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="board" id="board"></div>
  <div class="roads">
    <h3 id="roadsTitle">Caminos · progreso</h3>
    <div class="roads-grid" id="roads"></div>
  </div>
  <div class="foot">Vista previa con datos ficticios · el tablero real es privado (protegido con contraseña).</div>

<script>
(function(){
  var C = {
    "irving": {
      acc:"#9DB4CF",
      title:"Tablero de actividades · Irving",
      subtitle:"Kanban · calendario · recordatorios por WhatsApp · sync con Google Calendar",
      chips:[["18","Tareas activas"],["5","En curso"],["86%","Meta semanal"],["4","Hábitos"]],
      cols:[
        {h:"Por hacer", c:"#6B6B6B", cards:[
          {t:"Entregar práctica 3 de Bases de Datos", labs:[["Escuela","#5B8DEF"]], due:"Hoy", av:"IS"},
          {t:"Repasar álgebra lineal para el parcial", labs:[["Estudio","#B79CC9"]], due:"Jue", av:"IS"},
          {t:"Renovar membresía del gimnasio", labs:[["Vida","#7FB89A"]], due:"Vie", av:"IS"}
        ]},
        {h:"En curso", c:"#E2A336", cards:[
          {t:"Proyecto final de Ciencia de Datos", labs:[["Escuela","#5B8DEF"],["Prioridad","#E5484D"]], due:"Lun", av:"IS", prog:60},
          {t:"Curso de NumPy (Learning Zone)", labs:[["Estudio","#B79CC9"]], due:"—", av:"IS", prog:45}
        ]},
        {h:"En revisión", c:"#5B8DEF", cards:[
          {t:"Reporte de laboratorio de Redes", labs:[["Escuela","#5B8DEF"]], due:"Mié", av:"IS", prog:90}
        ]},
        {h:"Hecho", c:"#7FB89A", cards:[
          {t:"Certificación de Git y GitHub", labs:[["Logro","#7FB89A"]], due:"✓", av:"IS"},
          {t:"Rutina de ejercicio (semana)", labs:[["Hábito","#7FB89A"]], due:"✓", av:"IS"},
          {t:"Leer capítulo 4 — Diseño UX", labs:[["Estudio","#B79CC9"]], due:"✓", av:"IS"}
        ]}
      ],
      roads:[["Ciencia de Datos",72],["Certificaciones",55],["Hábitos",88],["Lectura",40]]
    },
    "sbg": {
      acc:"#B79CC9",
      title:"Tablero SBG IPN · Actividades",
      subtitle:"Student Builder Group — organización de comunidad, eventos y contenido",
      chips:[["24","Tareas"],["6","En curso"],["3","Eventos"],["12","Miembros"]],
      cols:[
        {h:"Backlog", c:"#6B6B6B", cards:[
          {t:"Definir temática del próximo taller", labs:[["Contenido","#5B8DEF"]], due:"Sem 2", av:"SBG"},
          {t:"Buscar sede para el meetup", labs:[["Logística","#E2A336"]], due:"Sem 2", av:"SBG"}
        ]},
        {h:"En curso", c:"#E2A336", cards:[
          {t:"Diseñar identidad del evento", labs:[["Diseño","#B79CC9"],["Prioridad","#E5484D"]], due:"Vie", av:"IS", prog:65},
          {t:"Campaña de redes sociales", labs:[["Marketing","#D9928B"]], due:"Jue", av:"IS", prog:50},
          {t:"Coordinar con ponentes invitados", labs:[["Alianzas","#7FB89A"]], due:"Lun", av:"SBG", prog:30}
        ]},
        {h:"En revisión", c:"#5B8DEF", cards:[
          {t:"Flyer y publicación de convocatoria", labs:[["Diseño","#B79CC9"]], due:"Hoy", av:"IS", prog:85}
        ]},
        {h:"Hecho", c:"#7FB89A", cards:[
          {t:"Registro de asistentes abierto", labs:[["Logística","#E2A336"]], due:"✓", av:"SBG"},
          {t:"Kit de marca para redes", labs:[["Diseño","#B79CC9"]], due:"✓", av:"IS"}
        ]}
      ],
      roads:[["Diseño y marca",80],["Marketing",62],["Eventos",48],["Comunidad",70]]
    }
  };

  var q = new URLSearchParams(location.search);
  var key = (q.get("board")||"irving").toLowerCase();
  var d = C[key] || C.irving;
  document.documentElement.style.setProperty("--acc", d.acc);

  document.getElementById("title").textContent = d.title;
  document.getElementById("subtitle").textContent = d.subtitle;

  document.getElementById("chips").innerHTML = d.chips.map(function(c){
    return '<div class="chip"><div class="n">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>';
  }).join("");

  document.getElementById("board").innerHTML = d.cols.map(function(col){
    var cards = col.cards.map(function(card){
      var labs = (card.labs||[]).map(function(l){
        return '<span class="lab" style="color:'+l[1]+';background:color-mix(in oklab,'+l[1]+' 16%, transparent);border:1px solid color-mix(in oklab,'+l[1]+' 35%, transparent)">'+l[0]+'</span>';
      }).join("");
      var prog = card.prog!=null ? '<div class="prog"><i style="width:'+card.prog+'%"></i></div>' : '';
      return '<div class="card"><div class="t">'+card.t+'</div>'+
        (labs?'<div class="labels">'+labs+'</div>':'')+
        '<div class="meta"><span class="due">◷ '+card.due+'</span><span class="ava">'+card.av+'</span></div>'+
        prog+'</div>';
    }).join("");
    return '<div class="col"><h2><span class="bar" style="background:'+col.c+'"></span>'+col.h+
      '<span class="ct">'+col.cards.length+'</span></h2>'+cards+'</div>';
  }).join("");

  document.getElementById("roads").innerHTML = d.roads.map(function(r){
    return '<div class="road"><div class="rt"><b>'+r[0]+'</b><span>'+r[1]+'%</span></div>'+
      '<div class="prog"><i style="width:'+r[1]+'%"></i></div></div>';
  }).join("");
})();
</script>
</body>
</html>
