name: Refrescar proyectos desde GitHub

on:
  schedule:
    - cron: "17 9 * * *"   # diario ~3:17 a.m. CDMX
  workflow_dispatch: {}      # botón manual

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincronizar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync_repos.mjs
      - name: Commit si hubo cambios
        run: |
          if [ -n "$(git status --porcelain data/proyectos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/proyectos.json
            git commit -m "chore: refrescar proyectos desde GitHub"
            git push
          else
            echo "sin cambios"
          fi
