<script>
/* tema temprano: evita el parpadeo claro/oscuro antes de que cargue sitio.js */
(function(){try{var t=localStorage.getItem("irvin.tema");if(t!=="claro"&&t!=="oscuro"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"claro":"oscuro";}document.documentElement.setAttribute("data-tema",t);}catch(e){document.documentElement.setAttribute("data-tema","oscuro");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/eivind.css">
</head>

<main id="eivMount" class="eiv"></main>

  <aside class="eiv-panel" role="dialog" aria-modal="true" aria-label="Detalle del proyecto">
    <div id="eivPanelInner"></div>
  </aside>
</div>

<script>window.PAGINA="inicio";</script>
<script src="js/proyectos-data.js"></script>

</body>
