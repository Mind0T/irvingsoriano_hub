<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos · Irvin Soriano</title>
<meta name="description" content="Proyectos de Irvin Soriano en ciencia de datos, UX/UI, web y fotografía.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sistema.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="wrap page">
  <div class="pagehead reveal" style="--acc:var(--ux)">
    <p class="eyebrow" data-i18n="eye">Proyectos</p>
    <h2 data-i18n="h">Trabajo en tecnología y diseño</h2>
    <p class="lead" data-i18n="p">Una selección de mis repositorios en GitHub. Se actualiza solo conforme avanzo.</p>
  </div>
  <div class="filters reveal" id="filters" role="group" aria-label="Filtrar"></div>
  <div class="cards" id="grid"></div>
  <p id="empty" class="lead" hidden style="color:var(--text-muted)"></p>
</main>

<script src="js/fondo.js"></script>
<script>
window.PAGINA = "proyectos";
window.I18N = {
  es:{eye:"Proyectos",h:"Trabajo en tecnología y diseño",p:"Una selección de mis repositorios en GitHub. Se actualiza solo conforme avanzo.",code:"Código",live:"Ver",wip:"En construcción",empty:"Nada por aquí todavía."},
  en:{eye:"Projects",h:"Work in tech and design",p:"A selection of my GitHub repositories. It refreshes itself as I go.",code:"Code",live:"Live",wip:"Work in progress",empty:"Nothing here yet."}
};
var AREAS={all:{es:"Todos",en:"All",c:"var(--text-primary)"},tool:{es:"Herramientas",en:"Tools",c:"var(--tool)"},data:{es:"Ciencia de Datos",en:"Data Science",c:"var(--data)"},ux:{es:"UX / UI",en:"UX / UI",c:"var(--ux)"},web:{es:"Web",en:"Web",c:"var(--web)"},foto:{es:"Fotografía",en:"Photography",c:"var(--foto)"}};
var GH="https://github.com/Mind0T/", DATA=[], filt="all", curLang="es";
function escp(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var GHSVG='<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.9 2.3 5.9 2.6 5.9 2.6a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.5 9c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>';
var EXT='<svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>';
function drawFilters(){
  document.getElementById("filters").innerHTML = Object.keys(AREAS).map(function(k){
    return '<button data-f="'+k+'" aria-pressed="'+(filt===k)+'">'+AREAS[k][curLang]+'</button>';
  }).join("");
}
function drawGrid(){
  var list = DATA.filter(function(p){return filt==="all"||p.area===filt;});
  var g=document.getElementById("grid"), e=document.getElementById("empty");
  g.innerHTML = list.map(function(p){
    var a=AREAS[p.area]||AREAS.tool;
    return '<article class="card" style="--c:'+a.c+'"><div class="card-top"><span class="dot"></span><span class="card-area">'+escp(a[curLang])+'</span>'+
      (p.estado==="wip"?'<span class="card-flag">'+escp(window.T("wip"))+'</span>':'')+'</div>'+
      '<h3>'+escp(p.nombre)+'</h3><p>'+escp(p[curLang]||p.es)+'</p><div class="card-foot">'+
      '<a href="'+GH+escp(p.repo)+'" target="_blank" rel="noopener">'+GHSVG+window.T("code")+'</a>'+
      (p.live?'<a href="'+escp(p.live)+'" target="_blank" rel="noopener">'+EXT+window.T("live")+'</a>':'')+
      '<span class="card-lang"><span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:'+a.c+'"></span>'+escp(p.lang)+'</span></div></article>';
  }).join("");
  e.hidden = list.length>0; e.textContent = window.T("empty");
}
window.render = function(lang){
  curLang=lang;
  fetch("data/proyectos.json").then(function(r){return r.json();}).then(function(j){
    DATA=(j.proyectos||[]); drawFilters(); drawGrid();
  }).catch(function(){ drawFilters(); drawGrid(); });
  document.getElementById("filters").addEventListener("click",function(e){
    var b=e.target.closest("[data-f]"); if(!b) return; filt=b.dataset.f; drawFilters(); drawGrid();
  });
};
</script>
<script src="js/sitio.js"></script>
</body>
</html>
